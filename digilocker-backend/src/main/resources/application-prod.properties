# ==========================================
# PRODUCTION CONFIGURATION
# ==========================================

# Application
spring.application.name=digilocker-backend
server.port=8080

# AWS Region
app.aws.region=${AWS_REGION:ap-south-1}

# S3
app.aws.s3.bucket-name=${S3_BUCKET}

# DynamoDB
app.aws.dynamodb.table-name=${DYNAMODB_TABLE}

# KMS
app.aws.kms.key-id=${KMS_KEY_ID}

# Cognito
app.aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID}

# Logging
logging.level.root=INFO
logging.level.com.digilocker=INFO
logging.level.software.amazon.awssdk=WARN