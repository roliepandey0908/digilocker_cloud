
# ==========================================
# LOCAL DEVELOPMENT CONFIGURATION
# ==========================================

# AWS Region
app.aws.region=${AWS_REGION:ap-south-1}

# S3 Configuration
app.aws.s3.bucket-name=${S3_BUCKET:}

# DynamoDB Configuration
app.aws.dynamodb.table-name=${DYNAMODB_TABLE:}

# KMS Configuration
app.aws.kms.key-id=${KMS_KEY_ID:}

# Cognito Configuration
app.aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:ap-south-1_CInjiepJt}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${app.aws.region}.amazonaws.com/${app.aws.cognito.user-pool-id}

# Logging
logging.level.com.digilocker=DEBUG
logging.level.software.amazon.awssdk=INFO

# Cognito app client (set locally; do not commit AWS credentials)
app.aws.cognito.client-id=${COGNITO_CLIENT_ID:}
