
# ==========================================
# LOCAL DEVELOPMENT CONFIGURATION
# ==========================================

# AWS Region
app.aws.region=${AWS_REGION:ap-south-1}

# S3 Configuration
app.aws.s3.bucket-name=${S3_BUCKET:}

# DynamoDB Configuration
app.aws.dynamodb.table-name=${DYNAMODB_TABLE:}

# KMS Configuration
app.aws.kms.key-id=${KMS_KEY_ID:}

# Cognito Configuration
app.aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}

# Logging
logging.level.com.digilocker=DEBUG
logging.level.software.amazon.awssdk=INFO
